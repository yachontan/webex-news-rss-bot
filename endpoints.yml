# ============================================================
# endpoints.yml  —  外部サービスのAPIエンドポイント
#   URL はコードに直書きせず、この1か所に集約する。
#
#   urls.yml との違い / How this differs from urls.yml:
#     urls.yml       … 購読するRSS・天気の地点など、**利用者が育てる設定**
#     endpoints.yml  … アプリが動くために必要な**固定の宛先**。通常は編集しない
#
#   サービス側がURLを変更した場合は、コードではなくここを直す。
# ============================================================

webex:
  messages:  https://webexapis.com/v1/messages     # メッセージ投稿
  rooms:     https://webexapis.com/v1/rooms        # スペース一覧の取得
  people_me: https://webexapis.com/v1/people/me    # bot 自身の情報（表示名・アドレス）

llm:
  # 要約・再ランクに使う。どれを使うかは .env の LLM_PROVIDER で決まる。
  anthropic: https://api.anthropic.com/v1/messages
  openai:    https://api.openai.com/v1/chat/completions
  # gemini はこのURLの後ろに `/{モデル名}:generateContent` を付けて呼ぶ
  gemini:    https://generativelanguage.googleapis.com/v1beta/models

weather:
  # ウィザードが「地名 → 緯度経度」を引くときに使う（APIキー不要）
  geocoding:        https://geocoding-api.open-meteo.com/v1/search
  # 天気予報APIの既定値。ウィザードが urls.yml の weather.api_url に書き込む。
  # 実際に予報を取りに行く先は urls.yml 側の値なので、変更はそちらで行う。
  forecast_default: https://api.open-meteo.com/v1/forecast

healthcheck:
  # 配信前の疎通確認先。DNS が引けて、期待した HTTP 応答が返ることを確かめる。
  # 無線が切れている・スリープ復帰直後で DNS が返らない状態のまま配信すると、
  # フィードは取れても投稿先の名前解決に失敗し、全チャンネルが空振りするため。
  # ここに挙げた URL が**すべて**通ったときだけ配信する。
  timeout: 10
  urls:
  - url: https://www.cisco.com        # 一般的なインターネット疎通
    expect: [200]
  - url: https://webexapis.com/v1/ping  # 実際の投稿先（認証なしでも 200 が返る）
    expect: [200]

compose:
  # 「収集 → 生成 → 投稿」の3段分割（--pipeline）で、選定と要約を担う実行系。
  #   kind: cli … 手元のコマンドを起動する（サブスクリプションの枠で動く）
  #   kind: api … 既存の要約と同じ HTTP API を呼ぶ（従量課金）
  # どれを使っても同じ指示ファイル（compose_select.md / compose_summarize.md）と
  # 同じ JSON の契約（selected.json / composed.json）で動く。
  # コマンドの場所は bin_env の環境変数（.env）で上書きできる。
  default: claude
  backends:
    claude:
      kind: cli
      command: claude
      bin_env: COMPOSE_CLAUDE_BIN          # .env で絶対パスを上書きできる
      token_env: CLAUDE_CODE_OAUTH_TOKEN
      # API キーが環境にあると従量課金の API を使ってしまうため、渡す前に外す
      drop_env: [ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY]
      default_model: sonnet
      args: ["-p", "{prompt}", "--model", "{model}", "--fallback-model", "opus",
             "--safe-mode", "--allowedTools", "Read,Write",
             "--disallowedTools", "Bash,Edit,WebFetch,WebSearch,Task",
             "--permission-mode", "acceptEdits", "--no-session-persistence",
             "--output-format", "json"]
    codex:
      kind: cli
      command: codex
      bin_env: COMPOSE_CODEX_BIN
      default_model: gpt-5
      args: ["exec", "{prompt}"]
    anthropic: {kind: api, provider: anthropic, default_model: claude-haiku-4-5-20251001}
    openai:    {kind: api, provider: openai,    default_model: gpt-5-mini}
    gemini:    {kind: api, provider: gemini,    default_model: gemini-2.5-flash}
